name: Import approved Q2 kernel fact history

on:
  push:
    branches: [main]
    paths:
      - '.publication/q2-kernel-fact-read-20260927/source.bundle'
      - '.publication/q2-kernel-fact-read-20260927/manifest.json'
      - '.github/workflows/import-q2-kernel-fact-read-20260927.yml'

permissions:
  contents: write

concurrency:
  group: import-approved-q2-kernel-fact-history-20260927
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'kongbu0621/infra-local-hand' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact approved bundle and history
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('.publication/q2-kernel-fact-read-20260927')
          raw = (root / 'source.bundle').read_bytes()
          assert len(raw) == 32351
          assert hashlib.sha256(raw).hexdigest() == '302f9bff1f33859ebaa01264164f29015450c22acfbc28cdf26895f7fb56ab40'
          assert hashlib.sha256((root / 'manifest.json').read_bytes()).hexdigest() == 'beb41444c4a2b0bd41f81c0f11bee3a693da3397c100d1443bc8cd44d68d656b'
          PY
          git -c core.hooksPath=/dev/null bundle verify '.publication/q2-kernel-fact-read-20260927/source.bundle'
          git -c core.hooksPath=/dev/null fetch --no-tags '.publication/q2-kernel-fact-read-20260927/source.bundle' HEAD
          python3 -I -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess
          m = json.loads(pathlib.Path('.publication/q2-kernel-fact-read-20260927/manifest.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args])
          assert m['repository'] == 'kongbu0621/infra-local-hand'
          assert m['base'] == '19069a8ab62c19355ff8eed6ee65da2c459f3404'
          assert m['approved_a'] == '887b640b394f9983f37dfe97c58ba35aaa099359' and m['closed_c'] == 'f7f8b503470725ca1ba18d1cb8d8b39e09a15ea8'
          assert m['candidate_commit'] == 'e15c633adbdfbf1e29cb12b2410975fe4911458d' and m['candidate_tree'] == 'c7c60ec47b742615dbae9f8cb230679f3a9c4997'
          assert git('rev-parse', 'FETCH_HEAD').decode().strip() == 'e15c633adbdfbf1e29cb12b2410975fe4911458d'
          assert git('rev-parse', 'e15c633adbdfbf1e29cb12b2410975fe4911458d^{tree}').decode().strip() == 'c7c60ec47b742615dbae9f8cb230679f3a9c4997'
          commits = git('rev-list', '--reverse', '19069a8ab62c19355ff8eed6ee65da2c459f3404..e15c633adbdfbf1e29cb12b2410975fe4911458d').decode().splitlines()
          assert commits == [item['commit'] for item in m['commits']]
          assert commits.index('887b640b394f9983f37dfe97c58ba35aaa099359') < commits.index('f7f8b503470725ca1ba18d1cb8d8b39e09a15ea8') < len(commits) - 1
          prior, seen = '19069a8ab62c19355ff8eed6ee65da2c459f3404', set()
          for item in m['commits']:
              commit = item['commit']
              assert git('rev-list', '--parents', '-n', '1', commit).decode().split() == [commit, prior]
              assert item['parent'] == prior
              assert git('rev-parse', commit + '^{tree}').decode().strip() == item['tree']
              names = git('diff-tree', '--no-commit-id', '--name-only', '-r', prior, commit).decode().splitlines()
              assert names == [value['path'] for value in item['files']]
              for value in item['files']:
                  path = value['path']
                  assert path in m['approved_paths'] and not path.startswith(('.github/', '.publication/'))
                  listing = git('ls-tree', '-z', commit, '--', path).rstrip(b'\0')
                  metadata, name = listing.split(b'\t', 1)
                  mode, kind, oid = metadata.decode().split()
                  assert name.decode() == path and kind == 'blob'
                  assert mode == value['mode'] and oid == value['git_blob']
                  raw = git('cat-file', 'blob', oid)
                  assert len(raw) == value['size'] and hashlib.sha256(raw).hexdigest() == value['sha256']
                  seen.add(path)
              prior = commit
          assert seen == set(m['approved_paths'])
          assert not git('diff', '--name-only', '19069a8ab62c19355ff8eed6ee65da2c459f3404', 'e15c633adbdfbf1e29cb12b2410975fe4911458d', '--', '.github')
          for path, pin in m['approved_documents'].items():
              raw = git('show', '887b640b394f9983f37dfe97c58ba35aaa099359:' + path)
              assert raw == git('show', 'e15c633adbdfbf1e29cb12b2410975fe4911458d:' + path)
              assert len(raw) == pin['size'] and hashlib.sha256(raw).hexdigest() == pin['sha256']
          assert m['kernel_source_path'] == 'tests/e3_host/q2_host_kernel_facts.py'
          assert m['kernel_source_sha256'] == '947469560ca3bdc4997a56739b42561c4a616a5dc8b250b919db589689eecc02'
          raw = git('show', 'e15c633adbdfbf1e29cb12b2410975fe4911458d:' + m['kernel_source_path'])
          assert hashlib.sha256(raw).hexdigest() == '947469560ca3bdc4997a56739b42561c4a616a5dc8b250b919db589689eecc02'
          print(json.dumps(dict(status='EXACT_HISTORY_VERIFIED', candidate='e15c633adbdfbf1e29cb12b2410975fe4911458d',
              commits=len(commits), files=len(seen), original_host_execution=False), sort_keys=True))
          PY
          git -c core.hooksPath=/dev/null fsck --full --no-reflogs
      - name: Verify actual unprivileged fixed kernel reads on CI runner
        shell: bash
        run: |
          set -euo pipefail
          git show 'e15c633adbdfbf1e29cb12b2410975fe4911458d:tests/e3_host/q2_host_kernel_facts.py' > "$RUNNER_TEMP/q2-approved-kernel-facts.py"
          python3 -I -B -S - <<'PY'
          import errno, hashlib, importlib.util, json, os, pathlib, signal, sys, time
          result = dict(schema='local-hand-q2-ci-unprivileged-kernel-facts/v1',
              candidate='e15c633adbdfbf1e29cb12b2410975fe4911458d', source_sha256='947469560ca3bdc4997a56739b42561c4a616a5dc8b250b919db589689eecc02',
              original_host_execution=False, execution_window_consumed=False,
              remote_called=False, euid=os.geteuid(), observations=[], status='BLOCKED')
          origin_mono = time.monotonic_ns()
          origin_boot = time.clock_gettime_ns(time.CLOCK_BOOTTIME)
          def guard():
              if (time.monotonic_ns() - origin_mono >= 120 * 10**9
                  or time.clock_gettime_ns(time.CLOCK_BOOTTIME) - origin_boot >= 120 * 10**9):
                  raise TimeoutError('CI_KERNEL_FACT_DEADLINE')
          def interrupt(signum, frame):
              raise TimeoutError('CI_KERNEL_FACT_DEADLINE')
          signal.signal(signal.SIGALRM, interrupt)
          signal.setitimer(signal.ITIMER_REAL, 120)
          try:
              if os.geteuid() == 0:
                  raise ValueError('CI_RUNNER_IS_ROOT')
              guard()
              try:
                  fd = os.open('/proc/sys/kernel/random/boot_id',
                      os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NOATIME)
              except OSError as error:
                  result['normal_noatime_errno'] = error.errno
                  if error.errno != errno.EPERM:
                      raise ValueError('CI_NOATIME_BASELINE_NOT_EPERM') from None
              else:
                  os.close(fd)
                  raise ValueError('CI_NOATIME_BASELINE_UNEXPECTEDLY_PERMITTED')
              guard()
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'q2-approved-kernel-facts.py'
              if hashlib.sha256(path.read_bytes()).hexdigest() != '947469560ca3bdc4997a56739b42561c4a616a5dc8b250b919db589689eecc02':
                  raise ValueError('CI_KERNEL_SOURCE_DIGEST')
              spec = importlib.util.spec_from_file_location('_q2_approved_kernel_facts', path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for target, maximum in (('boot', 64), ('mountinfo', 1024**2)):
                  detail = {}
                  raw = module.read_fact(target, guard, detail)
                  if detail['status'] != 'OBSERVED' or not 0 < len(raw) <= maximum:
                      raise ValueError('CI_KERNEL_FACT_NOT_OBSERVED')
                  if (detail['qualification']['native_metadata_crosscheck_complete'] is not True
                      or detail['qualification']['content_open_noatime'] is not False):
                      raise ValueError('CI_KERNEL_FACT_QUALIFICATION_INCOMPLETE')
                  result['observations'].append(dict(target=target, status=detail['status'],
                      bytes=len(raw), qualification=detail['qualification'], euid=detail['euid']))
                  del raw, detail
              guard()
              result['status'] = 'PASS'
          except BaseException as error:
              result['reason'] = (error.reason if hasattr(error, 'reason')
                  else str(error) if isinstance(error, (ValueError, TimeoutError))
                  else 'CI_KERNEL_FACT_INTERNAL_ERROR')
              result['error_type'] = type(error).__name__
              if hasattr(error, 'detail'):
                  result['failure'] = error.detail
          finally:
              signal.setitimer(signal.ITIMER_REAL, 0)
          print(json.dumps(result, sort_keys=True))
          sys.exit(0 if result['status'] == 'PASS' else 2)
          PY
      - name: Publish exact candidate to fixed import branch
        shell: bash
        run: |
          set -euo pipefail
          target='refs/heads/candidate/q2-kernel-fact-read-e15c633adbdf'
          candidate='e15c633adbdfbf1e29cb12b2410975fe4911458d'
          existing="$(git ls-remote --refs origin "$target")"
          if [ -n "$existing" ]; then
            test "${existing%%[[:space:]]*}" = "$candidate"
          else
            git -c core.hooksPath=/dev/null push origin "$candidate:$target"
          fi
          test "$(git ls-remote --refs origin "$target" | cut -f1)" = "$candidate"
