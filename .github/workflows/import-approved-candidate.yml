name: Import Owner-approved S1 history

on:
  push:
    branches: [main]
    paths: ['.publication/source.bundle', '.github/workflows/import-approved-candidate.yml']

permissions:
  contents: write

concurrency:
  group: import-approved-s1-history
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'kongbu0621/infra-local-hand' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify approved bundle and exact independent history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('.publication/source.bundle')
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '25d46d01f77923351d91b3c2a408eeae5a3cc1705f9ca2f0b4d50fcbf92546c2'
          assert actual == expected, (actual, expected)
          m = json.loads(pathlib.Path('.publication/manifest.json').read_text())
          assert m['bundle_sha256'] == expected
          assert m['candidate_commit'] == 'b763bd6714721d22278086db559fa3f6684aad7b'
          assert m['candidate_tree'] == '0dbf04548f42bbb3693524ae5bd8adedeecd2de1'
          PY
          git bundle verify .publication/source.bundle
          git -c core.hooksPath=/dev/null fetch --no-tags .publication/source.bundle refs/heads/main:refs/heads/import-approved-s1
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          m = json.loads(pathlib.Path('.publication/manifest.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args])
          head = git('rev-parse', 'refs/heads/import-approved-s1').decode().strip()
          assert head == m['candidate_commit']
          assert git('rev-parse', head + '^{tree}').decode().strip() == m['candidate_tree']
          commits = git('rev-list', '--reverse', head).decode().splitlines()
          assert commits == m['commits'] and len(commits) == 7
          assert commits[0] == '7246b850ffdc2709e359b09cac99f0fb88bda209'
          assert commits[1] == '48730d037a1d5c50e8380a60d5b8399e90e1e01c'
          assert '10d2a5c827964989f41ca6e8eeac3d44de6d0f04' not in commits
          actual = []
          for row in git('ls-tree', '-rz', head).split(b'\0'):
              if not row:
                  continue
              meta, name = row.split(b'\t')
              mode, kind, oid = meta.decode().split()
              assert kind == 'blob'
              data = git('cat-file', 'blob', oid)
              actual.append(dict(path=name.decode(), mode=mode, git_blob=oid,
                                 sha256=hashlib.sha256(data).hexdigest(), size=len(data)))
          assert actual == m['files'] and len(actual) == 54
          for path in ['docs/REQUIREMENTS.md', 'docs/ARCHITECTURE.md', 'docs/IMPLEMENTATION_PLAN.md']:
              assert git('show', commits[0] + ':' + path) == git('show', head + ':' + path)
          print('Verified 54 files, 7 independent commits, exact approved tree and A/C/D sequence.')
          PY
          git fsck --full --no-reflogs
      - name: Publish exact approved candidate on a new branch
        shell: bash
        run: |
          set -euo pipefail
          target=refs/heads/candidate/s1-b763bd6
          approved=b763bd6714721d22278086db559fa3f6684aad7b
          existing="$(git ls-remote --refs origin "$target")"
          if [ -n "$existing" ]; then
            test "${existing%%[[:space:]]*}" = "$approved"
            echo 'Exact candidate branch already exists; no update needed.'
          else
            git -c core.hooksPath=/dev/null push origin "$approved:$target"
          fi
          test "$(git ls-remote --refs origin "$target" | cut -f1)" = "$approved"
