<g id="node-F" data-node="F"><rect class="node refactor-target" x="530" y="620" width="380" height="120" rx="18"/>
<rect class="refactor-badge" x="780" y="584" width="116" height="30" rx="7"/>
<text class="refactor-label" x="838" y="607">D1 · D2</text>
<text class="heading" x="720" y="670">固定动作与监督调用</text>
<text class="" x="720" y="708">文件 · 服务 · 网关适配器</text>
</g>
<g id="node-T" data-node="T"><rect class="business" x="1010" y="620" width="380" height="150" rx="18"/>
<text class="heading" x="1200" y="666">既有任务执行与结果</text>
<text class="" x="1200" y="704">已接受任务自然收尾</text>
<text class="" x="1200" y="742">保留原任务账本与证据</text>
</g>
<g id="node-Q" data-node="Q"><rect class="business" x="1010" y="840" width="380" height="100" rx="18"/>
<text class="heading" x="1200" y="880">原任务查询 / 取消 / 读取</text>
<text class="" x="1200" y="918">维护标记不禁止原有权限</text>
</g>
<g id="node-H" data-node="H"><rect class="node" x="50" y="1040" width="380" height="130" rx="18"/>
<text class="heading" x="240" y="1076">本地部署检查</text>
<text class="" x="240" y="1114">版本 · 配置 · 协议 · 准入</text>
<text class="" x="240" y="1152">观察本地实际状态</text>
</g>
<g id="node-J" data-node="J"><rect class="node" x="530" y="1040" width="380" height="130" rx="18"/>
<text class="heading" x="720" y="1076">公网独立检查</text>
<text class="" x="720" y="1114">网络可达性 · 鉴权路由</text>
<text class="" x="720" y="1152">观察公网实际入口</text>
</g>
<g id="node-K" data-node="K"><rect class="business" x="1010" y="1040" width="380" height="130" rx="18"/>
<text class="heading" x="1200" y="1076">客户端实际验收</text>
<text class="" x="1200" y="1114">连接 · 调用 · 原结果取回</text>
<text class="" x="1200" y="1152">独立的实际调用证据</text>
</g>
<g id="node-R" data-node="R"><rect class="store" x="430" y="1280" width="580" height="120" rx="18"/>
<text class="heading" x="720" y="1330">分层结果与可重建报告</text>
<text class="" x="720" y="1368">分别绑定版本、时间和证据；未知如实保留</text>
</g>
<g data-from="A" data-to="B" data-label="生成计划"><path class="edge" d="M 430 210 H 530"/><text class="edge-label" x="480" y="194">生成计划</text></g>
<g data-from="B" data-to="C" data-label="核对并接续"><path class="edge" d="M 720 270 V 350"/><text class="edge-label" x="825" y="316">核对并接续</text></g>
<g data-from="C" data-to="D" data-label="持久写入"><path class="edge" d="M 530 394 H 430"/><text class="edge-label" x="480" y="378">持久写入</text></g>
<g data-from="D" data-to="C" data-label="恢复读取"><path class="edge" d="M 430 454 H 530"/><text class="edge-label" x="480" y="438">恢复读取</text></g>
<g data-from="C" data-to="E" data-label="控制维护"><path class="warmedge" d="M 910 424 H 1010"/><text class="edge-label" x="960" y="405">控制维护</text></g>
<g data-from="I" data-to="E" data-label="最终入口共同检查"><path class="warmedge" d="M 1200 270 V 350"/><rect x="1112" y="293" width="176" height="29" fill="#0d1117"/><text class="edge-label" x="1200" y="316">最终入口共同检查</text></g>
<g data-from="C" data-to="F" data-label="满足前置条件才执行"><path class="edge" d="M 720 500 V 620"/><rect x="706" y="543" width="198" height="29" fill="#0d1117"/><text class="edge-label" x="805" y="566">满足前置条件才执行</text></g>
<g data-from="F" data-to="G" data-label="核对效果"><path class="edge" d="M 530 680 H 430"/><text class="edge-label" x="480" y="662">核对效果</text></g>
<g data-from="G" data-to="C" data-label="反馈实际状态"><path class="edge" d="M 240 620 V 570 H 480 V 480 H 530"/><text class="edge-label" x="260" y="596">反馈实际状态</text></g>
<g data-from="E" data-to="T" data-label="开放后才接收新任务"><path class="warmedge" d="M 1200 500 V 620"/><rect x="1101" y="543" width="198" height="29" fill="#0d1117"/><text class="edge-label" x="1200" y="566">开放后才接收新任务</text></g>
<g data-from="Q" data-to="T" data-label="按原任务操作"><path class="businessedge" d="M 1200 840 V 770"/><text class="edge-label" x="1305" y="810">按原任务操作</text></g>
<g data-from="H" data-to="G" data-label="本地验证反馈"><path class="edge" d="M 240 1040 V 770"/><text class="edge-label" x="130" y="970">本地验证反馈</text></g>
<g data-from="H" data-to="R" data-label="本地证据"><path class="edge" d="M 240 1170 V 1335 H 430"/><text class="edge-label" x="305" y="1260">本地证据</text></g>
<g data-from="J" data-to="R" data-label="公网证据"><path class="edge" d="M 720 1170 V 1280"/><text class="edge-label" x="796" y="1230">公网证据</text></g>
<g data-from="K" data-to="R" data-label="客户端证据"><path class="businessedge" d="M 1200 1170 V 1335 H 1010"/><text class="edge-label" x="1135" y="1260">客户端证据</text></g>
<text class="note" x="500" y="830">部署只改变受管配置、服务和网关</text>
<text class="note" x="500" y="870">不重放业务；不恢复旧业务数据库</text>
<text class="note" x="500" y="910">服务切换可能短时断连，保留本地恢复通路</text>
<text class="warm" x="720" y="1483">收敛条件：故障解除、证据齐备后，在预定预算内达到预定终态</text>
<text class="note" x="720" y="1526">完成目标 / 恢复原状态 / 明确冲突拒绝；持续等待不算恢复通过</text>
<g id="refactor-location" data-node="LOCATION_NOTE" aria-label="与多节点图及认证调用图的位置对应">
<rect x="50" y="1570" width="1340" height="260" rx="18" fill="#211b15" stroke="#f2a65a" stroke-width="2"/>
<text class="heading refactor-label" x="720" y="1613">本图展开节点内的维护流程；橙色编号标出它作用的位置</text>
<text x="720" y="1656">D1 网关配置发布与恢复 → 多节点图的 HTTPS 入口；认证图④所经入口</text>
<text x="720" y="1697">D2 MCP 服务部署与恢复 → 多节点图的 MCP 服务；认证图④后续服务段</text>
<text x="720" y="1738">D3 后端维护准入 → 认证图⑤之后的新准备／首次执行；也约束本地 CLI</text>
<text class="note" x="720" y="1784">计划器、协调器和恢复记录在管理侧运行；不是每次任务调用都执行的步骤</text>
</g>
</svg>
