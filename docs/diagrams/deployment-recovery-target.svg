<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1870" viewBox="0 0 1440 1870" role="img" aria-labelledby="title description">
<title id="title">部署与恢复重构：同一操作接续，分层验证结果</title>
<desc id="description">设计中，尚未实现、部署或验收。受保护输入经只读计划器进入部署协调器；协调器读写独立持久恢复记录，控制最终准入维护屏障，通过固定监督动作修改文件、服务和网关，由实际状态观察器反馈。CLI 与 MCP 的新准备和首次执行共同检查屏障，已接受任务自然收尾，原任务查询、取消和证据读取不被维护标记禁止。部署不重放业务。本地、公网和客户端各自取得证据，汇入分层报告；公网超时不触发自动重装。支持范围内故障解除后须在预定预算内达到预定终态。橙色 D1/D2 的固定适配器对应 HTTPS/网关和 MCP 服务，D3 屏障对应后端维护准入；与另外两图共享位置编号，不是每次任务调用的新步骤。</desc>
<!-- Relationship source: deployment-recovery-target.mmd. Nodes and directed edges are kept in sync. -->
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#bfd0df" stroke-width="1.5"/></marker>
<style>
text {font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; font-size:23px; fill:#d7e6f3; text-anchor:middle;}
.title {font-size:35px;font-weight:600;fill:#e0efff;}
.heading {font-size:28px;font-weight:600;}
.note {font-size:23px;fill:#b5c4d0;}
.warm {fill:#e4c897;}
.node {fill:#102c42;stroke:#527c99;stroke-width:1.8;}
.control {fill:#193e58;stroke:#85b4d6;stroke-width:2.4;}
.store {fill:#2c2543;stroke:#9d85b9;stroke-width:1.8;}
.gate {fill:#342c20;stroke:#b49865;stroke-width:1.8;}
.business {fill:#15372e;stroke:#73a995;stroke-width:1.8;}
.edge,.warmedge,.businessedge {fill:none;stroke:#bfd0df;stroke-width:2.3;stroke-linejoin:round;marker-end:url(#arrow);}
.warmedge {stroke:#e4c897;}
.businessedge {stroke:#9bcbb9;}
.edge-label {font-size:21px;fill:#bdcedc;}
.refactor-target {stroke:#f2a65a;stroke-width:3;}
.refactor-badge {fill:#3b2a19;stroke:#f2a65a;stroke-width:2;}
.refactor-label {fill:#ffd4a3;font-weight:600;}
</style></defs>
<rect width="1440" height="1870" rx="24" fill="#0d1117"/>
<text class="title" x="720" y="55">部署与恢复：同一操作接续，分层验证结果</text>
<text class="warm" x="720" y="104">设计中 · 当前单节点 Linux / systemd 范围 · 尚未实现、部署或验收</text>
<rect x="30" y="990" width="1380" height="440" rx="22" fill="#101a24" stroke="#40576c" stroke-dasharray="8 6"/>
<text class="note" x="720" y="1020">各层独立取证，本地完成不自动证明公网或客户端通过</text>
<g id="node-A" data-node="A"><rect class="node" x="50" y="150" width="380" height="120" rx="18"/>
