<rect class="refactor-badge" x="1315" y="314" width="62" height="30" rx="7"/>
<text class="refactor-label" x="1346" y="337">D3</text>
<text class="heading" x="1200" y="396">最终准入维护屏障</text>
<text class="" x="1200" y="434">统一关闭新准备 / 首次执行</text>
<text class="" x="1200" y="472">持久所有权 · 验证后释放</text>
</g>
<g id="node-G" data-node="G"><rect class="node" x="50" y="620" width="380" height="150" rx="18"/>
