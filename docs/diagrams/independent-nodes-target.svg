<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1780" viewBox="0 0 2160 1780" role="img" aria-labelledby="title description">
  <title id="title">Local Hand：多节点独立执行，可配置 NAS 成果存储（目标架构）</title>
  <desc id="description">合成示例：调用方分别连接独立执行节点 A、B、C；这些标签不指向实际设备，数量不是产品上限，各节点按部署选择平台。各节点受控执行自己的任务，保留执行状态、恢复与长期归档索引、有界待归档成果。白色主线经原节点返回各任务状态和可用证据；本地状态和保留的证据不等待 NAS，释放本地内容后，准确读回可能需要 NAS。绿色虚线是成果存储调用，响应沿原连接返回：示例 A、B 绑定存储节点 X，C 绑定存储节点 Y，也可全部绑定同一 NAS；该绑定不是实际资产映射。各 producer 分库保存，凭据和权限隔离。NAS 内受控接收端与 Ledger 成果库是目标部署，不执行 Local Hand 任务。首版只归档已退出、成功且封存的成果；其他状态留在原节点如实返回。在线归档、平台适配和多节点部署仍待实现或验收；已有 A2 快照不等于在线归档。NAS 离线先保留有界成果，容量不足限制新增任务，不自动重放。</desc>
