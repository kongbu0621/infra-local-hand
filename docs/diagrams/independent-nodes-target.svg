  <text class="small muted" x="1080" y="1712">各机独立启动，不互相代跑；共享 NAS 不共享任务状态或权限。NAS 离线先保留成果，容量不足限制新增任务。</text>
  <text class="small muted" x="1080" y="1748">本地状态与保留证据不等 NAS；释放本地内容后按原绑定读回。持续规划由调用方负责，各平台须分别验收。</text>
</svg>
