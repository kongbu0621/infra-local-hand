  <text class="small muted" x="1100" y="1428">在线入口与自动 outbox 为待实现；已有 Ledger A2 快照用于备份 / 恢复，不等于在线归档。</text>
  <text class="small muted" x="1100" y="1466">首版归档已退出、成功且封存的成果；失败 / 取消 / 未知保留在原节点并如实返回。</text>
